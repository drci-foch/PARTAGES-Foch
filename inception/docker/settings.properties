# INCEpTION — configuration PARTAGES (Hôpital Foch)
# Monté en lecture seule sur /export/settings.properties par docker-compose.yml

# Les comptes sont créés par l'administrateur uniquement (pas d'auto-inscription)
security.accept-new-users=false

# API distante (AERO) : utilisée par le script de provisionnement pour importer
# les 3 projets PARTAGES. Peut être repassée à false après le provisionnement.
remote-api.enabled=true

# Donne au compte admin par défaut l'accès à l'API distante (provisionnement)
# (clé exacte de la doc admin INCEpTION 38.5)
security.default-admin-remote-access=true

# Compte administrateur créé automatiquement au démarrage (mode serveur/Docker).
# Le mot de passe est un hash bcrypt préfixé par {bcrypt}.
# ⚠️ SUR LE SERVEUR : REMPLACER ce hash par le vôtre avant le premier démarrage :
#   python -c "import bcrypt; print(bcrypt.hashpw(b'VOTRE_MOT_DE_PASSE', bcrypt.gensalt(rounds=10, prefix=b'2a')).decode())"
# (hash ci-dessous = mot de passe du test local, à ne pas conserver)
security.default-admin-username=admin
security.default-admin-password={bcrypt}$2a$10$izvwqsQVKsdWM7L2ZJvG3uQeb0bqmXWn5QVyo5HbZpo4NWL9/6ium
